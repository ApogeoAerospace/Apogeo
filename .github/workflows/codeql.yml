name: CodeQL Advanced

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 16 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-24.04
          - language: python
            build-mode: none
            os: ubuntu-24.04
          - language: c-cpp
            build-mode: manual
            os: ubuntu-24.04
            triplet: x64-linux
          - language: c-cpp
            build-mode: manual
            os: macos-15-intel
            triplet: x64-osx
          - language: c-cpp
            build-mode: manual
            os: windows-2022
            triplet: x64-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install C++ build dependencies
        if: matrix.build-mode == 'manual' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install macOS build dependencies
        if: matrix.build-mode == 'manual' && runner.os == 'macOS'
        run: brew install cmake ninja pkg-config
      - name: Restore C++ dependency binary cache
        if: matrix.build-mode == 'manual' && runner.os != 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/vcpkg
          key: codeql-vcpkg-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v1
      - name: Set up pinned vcpkg
        if: matrix.build-mode == 'manual' && runner.os != 'Windows'
        shell: bash
        run: |
          bash tools/ci/setup_vcpkg.sh
          # Build dependencies before CodeQL tracing to keep extraction focused on project code.
          ./vcpkg/vcpkg install --triplet "${{ matrix.triplet }}"
      - name: Set up Windows dependencies
        if: matrix.build-mode == 'manual' && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/ci/setup_vcpkg.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./vcpkg/vcpkg.exe install --triplet x64-windows
      - name: Record scanned revision
        run: |
          echo 'CodeQL is scanning this checkout:'
          git rev-parse HEAD
          python -m unittest discover -s tests -p test_ci_sarif.py -v
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/config.yml
          db-location: ${{ runner.temp }}/codeql-database
      - name: Build project for C++ extraction
        if: matrix.build-mode == 'manual' && runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build-codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build-codeql --clean-first --parallel 2
      - name: Build Windows targets for extraction
        if: matrix.build-mode == 'manual' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-codeql -G "Visual Studio 17 2022" -A x64 -DENABLE_TESTING=ON -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/vcpkg_installed" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-codeql --config Debug --clean-first --parallel 2
      - name: Analyze security
        id: analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.os }}
          output: ${{ runner.temp }}/codeql-results
          upload-database: false
          # Enforce locally before uploading; fork PRs do not need upload permissions to run the gate.
          upload: never
      - name: Enforce security findings gate
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: python tools/ci/check_sarif.py "$SARIF_DIRECTORY"
      - name: Upload security findings to code scanning
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}/os:${{ matrix.os }}
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}-${{ matrix.os }}
          path: ${{ runner.temp }}/codeql-results/
          retention-days: 14

  security-gate:
    name: CodeQL Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: analyze
    if: always()
    steps:
      - name: Require every language analysis to pass
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          echo "CodeQL language matrix result: $ANALYSIS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ANALYSIS_RESULT" != success ]]; then
            echo '::error::CodeQL analysis or findings gate failed, was cancelled, or was skipped'
            exit 1
          fi
