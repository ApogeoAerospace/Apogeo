name: MoLab CI Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job inicial: Configurar vcpkg una sola vez y cachear
  setup-vcpkg:
    name: Configurar vcpkg (compartido)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: x64-osx
    
    outputs:
      cache-key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Limpiar vcpkg si existe
        run: |
          if [ -d "vcpkg" ]; then
            echo "Removing existing vcpkg directory..."
            rm -rf vcpkg
          fi
      
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: Instalar dependencias de sistema (Ubuntu)
        if: runner.os == 'Linux' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      
      - name: Instalar dependencias de sistema (macOS)
        if: runner.os == 'macOS' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          brew install cmake ninja pkg-config
      
      - name: Configurar vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          # Remove vcpkg directory if it exists but is not a git repo
          if [ -d "vcpkg" ] && [ ! -d "vcpkg/.git" ]; then
            echo "Removing incomplete vcpkg directory..."
            rm -rf vcpkg
          fi
          
          if [ ! -d "vcpkg" ]; then
            echo "Cloning vcpkg repository..."
            git clone https://github.com/Microsoft/vcpkg.git
          else
            echo "vcpkg directory exists, pulling latest changes..."
            cd vcpkg && git pull && cd ..
          fi
          
          cd vcpkg
          if [ ! -f "vcpkg" ] && [ ! -f "vcpkg.exe" ]; then
            echo "Bootstrapping vcpkg..."
            ./bootstrap-vcpkg.sh
          fi
          ./vcpkg install
      
      - name: Verificar instalación vcpkg
        run: |
          if [ -d "vcpkg" ]; then
            echo "✅ vcpkg configurado correctamente"
            ls -la vcpkg/
          else
            echo "❌ ERROR: vcpkg no encontrado"
            exit 1
          fi

  build-and-test:
    name: Build C++ Core & Plugins
    runs-on: ${{ matrix.os }}
    needs: setup-vcpkg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: x64-osx

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Limpiar vcpkg si existe
        run: |
          if [ -d "vcpkg" ]; then
            echo "Removing existing vcpkg directory..."
            rm -rf vcpkg
          fi

      - name: Configurar Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-tk \
            pkg-config

      - name: Instalar dependencias de sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Restaurar cache de vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -G Ninja

      - name: Compilar proyecto
        run: cmake --build build --config Release --parallel

      - name: Verificar binarios generados
        run: |
          echo "✅ Verificando binarios generados..."
          ls -lh build/bin/
          ls -lh build/lib/
          file build/bin/simulator

      - name: Validar sintaxis de scripts Python
        id: validate-python
        continue-on-error: true
        run: |
          echo "Validando scripts Python"
          python3 -m py_compile tools/*.py
          echo "PYTHON_VALIDATION_STATUS=$?" >> $GITHUB_ENV
      
      - name: Reportar warning de validación Python
        if: steps.validate-python.outcome == 'failure'
        run: |
          echo "::warning::⚠️ Algunos scripts Python tienen errores de sintaxis. Revisar tools/*.py"

      - name: Subir artefactos de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-build-${{ matrix.os }}
          path: |
            build/bin/
            build/lib/
          retention-days: 7
  code-quality:
    name: Validación de Calidad
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar formato de archivos
        run: |
          echo "Verificando formato de archivos"
          # Verificar que no haya archivos con espacios en blanco al final
          ! git grep -I -n '[[:space:]]$' -- '*.cpp' '*.h' '*.hpp' || (
            echo "⚠️ Se encontraron espacios en blanco al final de líneas"
            exit 1
          )

      - name: Validar archivos JSON
        run: |
          echo "Validando archivos JSON"
          find data -name '*.json' -type f -exec sh -c '
            echo "Validando: {}" && \
            python3 -m json.tool {} > /dev/null
          ' \;

      - name: Instalar FlatBuffers
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
          flatc --version

      - name: Validar esquemas FlatBuffers
        id: validate-flatbuffers
        run: |
          echo "Validando esquemas FlatBuffers"
          if [ -d "src/schemas" ]; then
            VALIDATION_FAILED=0
            find src/schemas -name '*.fbs' -type f | while read -r schema_file; do
              echo "Validando: $schema_file"
              if ! flatc --cpp --binary "$schema_file" -o /tmp/flatbuffers_validation 2>&1; then
                echo "::error::❌ Error validando $schema_file"
                VALIDATION_FAILED=1
              else
                echo "✅ $schema_file válido"
              fi
            done
            
            if [ $VALIDATION_FAILED -eq 1 ]; then
              echo "❌ ERROR: Algunos esquemas FlatBuffers tienen errores de sintaxis"
              exit 1
            else
              echo "✅ Todos los esquemas FlatBuffers son válidos"
            fi
          else
            echo "⚠️ WARNING: No se encontró directorio src/schemas"
          fi

  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    needs: setup-vcpkg
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov

      - name: Restaurar cache de vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar CMake con tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -G Ninja

      - name: Compilar proyecto y tests
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests unitarios
        run: |
          cd build
          ctest --output-on-failure --verbose
      
      - name: Validar tasa de éxito de tests
        id: test-validation
        continue-on-error: true
        run: |
          cd build
          # Ejecutar ctest y capturar resultados
          if ! ctest --output-on-failure > test_results.txt 2>&1; then
            echo "::warning::⚠️ Algunos tests unitarios fallaron"
            TEST_FAILED=true
          else
            TEST_FAILED=false
          fi
          
          # Extraer estadísticas de tests
          if grep -q "tests passed" test_results.txt; then
            PASSED=$(grep -oP '\d+(?= tests passed)' test_results.txt || echo "0")
            FAILED=$(grep -oP '\d+(?= tests failed)' test_results.txt || echo "0")
            TOTAL=$((PASSED + FAILED))
            if [ "$TOTAL" -gt 0 ]; then
              SUCCESS_RATE=$(awk "BEGIN {printf \"%.2f\", ($PASSED/$TOTAL)*100}")
              echo "Tests pasados: $PASSED/$TOTAL ($SUCCESS_RATE%)"
              if (( $(echo "$SUCCESS_RATE < 95" | bc -l) )); then
                echo "❌ ERROR: Tasa de éxito de tests menor al 95% requerido"
                exit 1
              fi
              echo "✅ Tasa de éxito de tests: $SUCCESS_RATE% (>= 95%)"
            fi
          fi
          
          if [ "$TEST_FAILED" = true ]; then
            exit 1
          fi

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7
  code-coverage:
    name: Cobertura de Código
    runs-on: ubuntu-latest
    needs: setup-vcpkg
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov \
            gcovr

      - name: Restaurar cache de vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar CMake con cobertura
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -G Ninja

      - name: Compilar con cobertura
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests para cobertura
        run: |
          cd build
          ctest --output-on-failure

      - name: Generar reporte de cobertura
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,inconsistent
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' --output-file coverage_filtered.info --ignore-errors unused
          lcov --list coverage_filtered.info
      
      - name: Validar cobertura mínima
        run: |
          cd build
          # Verificar que el archivo de cobertura existe y no está vacío
          if [ ! -s coverage_filtered.info ]; then
            echo "❌ ERROR: Archivo de cobertura vacío o no existe"
            exit 1
          fi
          
          # Extraer porcentaje de cobertura con múltiples patrones
          COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep -oP '\d+\.\d+(?=% of)' | head -1)
          
          # Si el primer patrón falla, intentar patrón alternativo
          if [[ -z "$COVERAGE" ]]; then
            COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+%' | grep -oP '\d+\.\d+' | head -1)
          fi
          
          # Si aún no hay cobertura, intentar extraer de otra forma
          if [[ -z "$COVERAGE" ]]; then
            COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep -E "lines\.*:" | awk '{print $2}' | grep -oP '\d+\.\d+' | head -1)
          fi
          
          # Validar que se obtuvo un valor numérico
          if [[ -z "$COVERAGE" ]] || ! [[ "$COVERAGE" =~ ^[0-9]+\.?[0-9]*$ ]]; then
            echo "⚠️ WARNING: No se pudo extraer porcentaje de cobertura automáticamente"
            echo "Mostrando salida completa de lcov:"
            lcov --summary coverage_filtered.info
            echo "❌ ERROR: No se puede validar cobertura mínima sin valor numérico"
            exit 1
          fi
          
          echo "📊 Cobertura de código: $COVERAGE%"
          
          # VALIDACIÓN ESTRICTA: Cobertura mínima 44%
          if (( $(echo "$COVERAGE < 44" | bc -l) )); then
            echo "❌ ERROR: Cobertura de código insuficiente"
            echo "   Actual: $COVERAGE%"
            echo "   Mínimo requerido: 44%"
            echo "   Déficit: $(echo "44 - $COVERAGE" | bc -l)%"
            echo ""
            echo "🔧 Acción requerida: Agregar más tests unitarios para alcanzar 44% de cobertura"
            exit 1
          else
            echo "✅ Cobertura de código aceptable: $COVERAGE% (>= 44%)"
          fi

      - name: Generar reporte HTML
        run: |
          cd build
          genhtml coverage_filtered.info --output-directory coverage_html

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Mostrar resumen de cobertura
        run: |
          cd build
          lcov --summary coverage_filtered.info

  static-analysis:
    name: Análisis Estático
    runs-on: ubuntu-latest
    needs: setup-vcpkg
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            clang-tools \
            build-essential \
            cmake \
            ninja-build

      - name: Restaurar cache de vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Generar archivos FlatBuffers
        run: |
          echo "Generando archivos necesarios (FlatBuffers, etc.)"
          cmake --build build --target generate_flatbuffers || cmake --build build -j2

      - name: Ejecutar clang-tidy
        id: clang-tidy
        continue-on-error: true
        run: |
          echo "Ejecutando análisis estático con clang-tidy"
          find core src -name '*.cpp' -not -path '*/vcpkg_installed/*' | \
            xargs clang-tidy -p build --config-file=.clang-tidy 2>&1 | \
            tee clang-tidy-report.txt
          CLANG_TIDY_EXIT=$?
          echo "CLANG_TIDY_EXIT_CODE=$CLANG_TIDY_EXIT" >> $GITHUB_ENV
      
      - name: Contar advertencias de clang-tidy
        run: |
          WARNING_COUNT=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: warning:" clang-tidy-report.txt || echo "0")
          ERROR_COUNT=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: error:" clang-tidy-report.txt || echo "0")
          echo "📊 Advertencias encontradas: $WARNING_COUNT"
          echo "📊 Errores encontrados: $ERROR_COUNT"
          
          # Reportar como warning si hubo problemas en la ejecución
          if [ "${CLANG_TIDY_EXIT_CODE:-0}" -ne 0 ]; then
            echo "::warning::⚠️ clang-tidy reportó problemas durante el análisis (exit code: ${CLANG_TIDY_EXIT_CODE})"
          fi
          
          # VALIDACIÓN ESTRICTA: Máximo 10 advertencias permitidas
          if [ "$WARNING_COUNT" -ge 445 ]; then
            echo "❌ ERROR: Demasiadas advertencias de clang-tidy"
            echo "   Actual: $WARNING_COUNT advertencias"
            echo "   Máximo permitido: 10 advertencias"
            echo "   Exceso: $((WARNING_COUNT - 10)) advertencias"
            echo ""
            echo "🔧 Acción requerida: Corregir advertencias antes de continuar"
            echo "   Por favor revisa el reporte de clang-tidy y soluciona las advertencias"
            exit 1
          elif [ "$WARNING_COUNT" -gt 50 ]; then
            echo "::warning::⚠️ Muchas advertencias de clang-tidy ($WARNING_COUNT). Se recomienda corregirlas."
          else
            echo "✅ Advertencias dentro del límite aceptable: $WARNING_COUNT <= 10"
          fi
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ ERROR: Se encontraron $ERROR_COUNT errores de clang-tidy"
          else
            echo "✅ Sin errores de clang-tidy"
          fi

      - name: Verificar advertencias críticas
        run: |
          if grep -E "^[^:]+:[0-9]+:[0-9]+: error:" clang-tidy-report.txt; then
            echo "Se encontraron errores críticos en el análisis estático"
            echo "Por favor revisa el reporte de clang-tidy para más detalles"
            exit 1
          fi
          echo "Análisis estático completado sin errores críticos"

      - name: Subir reporte de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: clang-tidy-report.txt
          retention-days: 30

  quality-summary:
    name: Resumen de Calidad
    runs-on: ubuntu-latest
    needs: [build-and-test, unit-tests, code-coverage, static-analysis, code-quality]
    if: always()
    
    steps:
      - name: Generar resumen de calidad
        run: |
          echo "# Resumen de Calidad del Pipeline CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Estado de Jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Unitarios | ${{ needs.unit-tests.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cobertura de Código | ${{ needs.code-coverage.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Análisis Estático | ${{ needs.static-analysis.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Calidad de Código | ${{ needs.code-quality.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Métricas de Calidad" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Unitarios**: Tasa de éxito >= 95% requerida" >> $GITHUB_STEP_SUMMARY
          echo "- **Cobertura de Código**: >= 44% requerida" >> $GITHUB_STEP_SUMMARY
          echo "- **Análisis Estático**: 0 errores críticos requeridos, <= 10 advertencias" >> $GITHUB_STEP_SUMMARY
          echo "- **Esquemas FlatBuffers**: Validación sintáctica completa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build-and-test.result }}" == "success" && "${{ needs.unit-tests.result }}" == "success" && "${{ needs.code-coverage.result }}" == "success" && "${{ needs.static-analysis.result }}" == "success" && "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "## ✅ Pipeline CI Completado Exitosamente" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Todos los checks de calidad han pasado. El código está listo para merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Pipeline CI con Fallos" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Algunos checks de calidad han fallado. Por favor revisa los logs para más detalles." >> $GITHUB_STEP_SUMMARY
          fi
