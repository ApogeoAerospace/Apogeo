name: Apogeo CI Pipeline

on:
  push:
    branches: ['**']

  workflow_dispatch:

  merge_group:

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MIN_COVERAGE: '80'
  MAX_TIDY_WARNINGS: '10'

jobs:
  # Initial job: configure vcpkg once and cache it
  setup-vcpkg:
    name: Configure vcpkg (shared)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: macos-15
            triplet: arm64-osx

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clean vcpkg if it exists
        run: |
          if [ -d "vcpkg" ]; then
            echo "Removing existing vcpkg directory..."
            rm -rf vcpkg
          fi

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Configure vcpkg
        run: |
          bash tools/ci/setup_vcpkg.sh
          ./vcpkg/vcpkg install --triplet "${{ matrix.triplet }}"

      - name: Verify vcpkg installation
        run: |
          if [ -d "vcpkg" ]; then
            echo "vcpkg configured correctly"
            ls -la vcpkg/
          else
            echo "ERROR: vcpkg not found"
            exit 1
          fi

  build-and-test:
    name: Build C++ Core & Plugins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: setup-vcpkg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: macos-15
            triplet: arm64-osx

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clean vcpkg if it exists
        run: |
          if [ -d "vcpkg" ]; then
            echo "Removing existing vcpkg directory..."
            rm -rf vcpkg
          fi

      - name: Configure Python 3.x
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-tk \
            pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Restore vcpkg cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3

      - name: Ensure pinned vcpkg toolchain
        run: bash tools/ci/setup_vcpkg.sh

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -G Ninja

      - name: Build project
        run: cmake --build build --config Release --parallel

      - name: Verify generated binaries
        run: |
          echo "Verifying generated binaries..."
          ls -lh build/bin/
          ls -lh build/lib/
          file build/bin/simulator

      - name: Validate Python script syntax
        run: python3 -m compileall -q tools

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apogeo-build-${{ matrix.os }}
          path: |
            build/bin/
            build/lib/
          retention-days: 7
  code-quality:
    name: Quality Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify file formatting
        run: |
          echo "Verifying file formatting"
          # Ensure there are no files with trailing whitespace
          ! git grep -I -n '[[:space:]]$' -- '*.cpp' '*.h' '*.hpp' || (
            echo "Trailing whitespace was found"
            exit 1
          )

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          for path in sorted(pathlib.Path('data').rglob('*.json')):
              print(f'Validating: {path}')
              with path.open(encoding='utf-8') as source:
                  json.load(source)
          PY

      - name: Install FlatBuffers
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
          flatc --version

      - name: Validate FlatBuffers schemas
        run: |
          test -d src/schemas
          mkdir -p /tmp/flatbuffers_validation
          while IFS= read -r -d '' schema_file; do
            echo "Validating: $schema_file"
            flatc --cpp -I src/schemas -o /tmp/flatbuffers_validation "$schema_file"
          done < <(find src/schemas -name '*.fbs' -type f -print0)

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: setup-vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Restore vcpkg cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3

      - name: Ensure pinned vcpkg toolchain
        run: bash tools/ci/setup_vcpkg.sh

      - name: Configure CMake with tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DENABLE_TESTING=ON \
            -G Ninja

      - name: Build project and tests
        run: cmake --build build --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --verbose --no-tests=error --timeout 120

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: setup-vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov

      - name: Restore vcpkg cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3

      - name: Ensure pinned vcpkg toolchain
        run: bash tools/ci/setup_vcpkg.sh

      - name: Configure CMake with coverage
        env:
          CXX: g++
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DENABLE_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS=-fprofile-update=atomic \
            -G Ninja

      - name: Build with coverage
        run: cmake --build build --config Debug --parallel

      - name: Run tests for coverage
        run: |
          cd build
          ctest --output-on-failure --no-tests=error --timeout 120

      - name: Generate coverage report
        run: |
          cd build
          # GCC can emit negative counters; lcov treats ignored negative counts as zero.
          lcov --capture --initial --directory . --output-file coverage_base.info --ignore-errors mismatch,inconsistent,negative
          lcov --capture --directory . --output-file coverage_run.info --ignore-errors mismatch,inconsistent,negative
          lcov --add-tracefile coverage_base.info --add-tracefile coverage_run.info --output-file coverage.info --ignore-errors inconsistent
          lcov --extract coverage.info "$GITHUB_WORKSPACE/src/*" "$GITHUB_WORKSPACE/plugins/*" --output-file coverage_project.info --ignore-errors unused,inconsistent
          lcov --remove coverage_project.info '*/tests/*' \
            --output-file coverage_filtered.info \
            --ignore-errors unused,inconsistent
          lcov --list coverage_filtered.info

      - name: Validate minimum coverage
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          found = hit = 0
          for line in pathlib.Path('build/coverage_filtered.info').read_text().splitlines():
              if line.startswith('LF:'):
                  found += int(line[3:])
              elif line.startswith('LH:'):
                  hit += int(line[3:])
          if found == 0:
              raise SystemExit('ERROR: Coverage report contains no executable lines')
          coverage = 100 * hit / found
          minimum = float(os.environ['MIN_COVERAGE'])
          print(f'Line coverage: {coverage:.2f}% ({hit}/{found}); required: {minimum}%')
          if coverage < minimum:
              raise SystemExit('ERROR: Insufficient line coverage; add unit tests')
          PY

      - name: Generate HTML report
        if: ${{ !cancelled() && hashFiles('build/coverage_filtered.info') != '' }}
        run: |
          cd build
          genhtml coverage_filtered.info --output-directory coverage_html

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('build/coverage_filtered.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            build/coverage_html/
            build/coverage_filtered.info
          retention-days: 30

      - name: Show coverage summary
        run: |
          cd build
          lcov --summary coverage_filtered.info

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: setup-vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            clang-tools \
            build-essential \
            cmake \
            ninja-build

      - name: Restore vcpkg cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3

      - name: Ensure pinned vcpkg toolchain
        run: bash tools/ci/setup_vcpkg.sh

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Generate FlatBuffers files
        run: |
          echo "Generating required files (FlatBuffers, etc.)"
          cmake --build build --target generate_flatbuffers

      - name: Run clang-tidy
        id: clang-tidy
        run: |
          python3 - <<'PY' > tidy-sources.txt
          import json
          import pathlib
          root = pathlib.Path.cwd()
          sources = set()
          for entry in json.loads(pathlib.Path('build/compile_commands.json').read_text()):
              path = pathlib.Path(entry['file'])
              if not path.is_absolute():
                  path = pathlib.Path(entry['directory']) / path
              path = path.resolve()
              if any(path.is_relative_to(root / folder) for folder in ('core', 'src', 'plugins')):
                  sources.add(str(path))
          if not sources:
              raise SystemExit('No project sources found for clang-tidy')
          for path in sorted(sources):
              print(path, end='\0')
          PY
          set +e
          xargs -0 -r clang-tidy -p build --config-file=.clang-tidy --checks='clang-analyzer-*,cert-*' --warnings-as-errors='clang-analyzer-*,cert-*' < tidy-sources.txt 2>&1 | tee clang-tidy-report.txt
          PIPE_EXIT=("${PIPESTATUS[@]}")
          TIDY_EXIT=${PIPE_EXIT[0]}
          if (( PIPE_EXIT[1] != 0 )); then exit 1; fi
          set -e
          echo "CLANG_TIDY_EXIT_CODE=$TIDY_EXIT" >> "$GITHUB_ENV"

      - name: Validate clang-tidy results
        run: |
          WARNING_COUNT=$(awk '/^[^:]+:[0-9]+:[0-9]+: warning:/ {n++} END {print n+0}' clang-tidy-report.txt)
          SECURITY_COUNT=$(awk '/^[^:]+:[0-9]+:[0-9]+: warning:.*\[(clang-analyzer-|cert-)/ {n++} END {print n+0}' clang-tidy-report.txt)
          ERROR_COUNT=$(awk '/^[^:]+:[0-9]+:[0-9]+: (fatal )?error:/ {n++} END {print n+0}' clang-tidy-report.txt)
          echo "Warnings: $WARNING_COUNT; maximum: $MAX_TIDY_WARNINGS"
          echo "Errors: $ERROR_COUNT; security diagnostics: $SECURITY_COUNT (allowed: 0)"
          if (( CLANG_TIDY_EXIT_CODE != 0 || SECURITY_COUNT > 0 || ERROR_COUNT > 0 || WARNING_COUNT > MAX_TIDY_WARNINGS )); then
            echo "::error::Static analysis failed; review the uploaded report"
            exit 1
          fi

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis-report
          path: clang-tidy-report.txt
          retention-days: 30

  sanitizer-tests:
    name: Address and Undefined Behavior Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: setup-vcpkg
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v3
      - name: Configure sanitizer build
        run: |
          bash tools/ci/setup_vcpkg.sh
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DENABLE_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitizer-test-results
          path: build/Testing/

  security-checks:
    name: Secret and Workflow Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Scan history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner --log-opts=--all .
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck=
      - name: Test security gate
        run: python3 -m unittest discover -s tests -p test_ci_sarif.py -v

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          warn-only: false

  codeql:
    name: Security Analysis
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [setup-vcpkg, build-and-test, unit-tests, code-coverage, static-analysis, code-quality, sanitizer-tests, security-checks, dependency-review, codeql]
    if: always()
    steps:
      - name: Enforce all quality and security gates
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# CI Quality and Security\n\n| Job | Result |\n|---|---|\n')
              for job, value in results.items():
                  status = value['result']
                  summary.write(f'| {job} | {status} |\n')
                  expected_skip = job == 'dependency-review' and os.environ['EVENT_NAME'] != 'pull_request'
                  if status != 'success' and not (expected_skip and status == 'skipped'):
                      failed.append(job)
              summary.write(f'\nRequired: {os.environ["MIN_COVERAGE"]}% line coverage; all tests pass; '
                            f'at most {os.environ["MAX_TIDY_WARNINGS"]} general tidy warnings; '
                            'zero analyzer/CERT diagnostics, secrets, sanitizer failures, or blocking CodeQL findings.\n')
          if failed:
              raise SystemExit('Failed or incomplete gates: ' + ', '.join(failed))
          PY
