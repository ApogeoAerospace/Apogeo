name: MoLab CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build C++ Core & Plugins
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: x64-osx

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-tk \
            pkg-config

      - name: Instalar dependencias de sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Configurar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'c8696863d371ab7f46e213d8f5ca923c4ff5e63c'

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -G Ninja

      - name: Compilar proyecto
        run: cmake --build build --config Release --parallel

      - name: Verificar binarios generados
        run: |
          echo " Verificando binarios generados..."
          ls -lh build/bin/
          ls -lh build/lib/
          file build/bin/simulator

      - name: Validar sintaxis de scripts Python
        run: |
          echo "Validando scripts Python"
          python3 -m py_compile tools/*.py || true

      - name: Subir artefactos de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-build-${{ matrix.os }}
          path: |
            build/bin/
            build/lib/
          retention-days: 7
  code-quality:
    name: Validación de Calidad
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar formato de archivos
        run: |
          echo "Verificando formato de archivos"
          # Verificar que no haya archivos con espacios en blanco al final
          ! git grep -I -n '[[:space:]]$' -- '*.cpp' '*.h' '*.hpp' || (
            echo " Se encontraron espacios en blanco al final de líneas"
            exit 1
          )

      - name: Validar archivos JSON
        run: |
          echo "Validando archivos JSON"
          find data -name '*.json' -type f -exec sh -c '
            echo "Validando: {}" && \
            python3 -m json.tool {} > /dev/null
          ' \;

      - name: Validar esquemas FlatBuffers
        run: |
          echo "Verificando esquemas FlatBuffers"
          if [ -d "src/schemas" ]; then
            find src/schemas -name '*.fbs' -type f
          fi

  integration-test:
    name: Test de Integración
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Descargar artefactos de build
        uses: actions/download-artifact@v4
        with:
          name: molab-build-ubuntu-latest
          path: build/

      - name: Configurar permisos de ejecución
        run: |
          chmod +x build/bin/simulator
          find build/lib -type f \( -name "*.so" -o -name "*.dylib" \) -exec chmod +x {} \;

      - name: Copiar archivos de configuración
        run: |
          mkdir -p build/bin/data/config
          mkdir -p build/bin/data/initial_state
          cp -r data/config/* build/bin/data/config/
          cp -r data/initial_state/* build/bin/data/initial_state/

      - name: Ejecutar simulación básica
        run: |
          echo "Ejecutando simulación de prueba"
          cd build/bin
          ./simulator --config data/config/basic_config.json --ticks 10 || (
            echo " Simulación falló"
            echo "Contenido de data/config:"
            ls -la data/config/ || echo "Directorio no existe"
            echo "Verificando binario:"
            file simulator
            ldd simulator || true
            exit 1
          )

      - name: Verificar archivos de salida
        run: |
          echo "Verificando archivos de salida generados"
          ls -lh build/bin/output/ || echo "No se generaron archivos de salida"
          ls -lh build/bin/logs/ || echo "No se generaron logs"

  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov

      - name: Configurar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'c8696863d371ab7f46e213d8f5ca923c4ff5e63c'

      - name: Configurar CMake con tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -G Ninja

      - name: Compilar proyecto y tests
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests unitarios
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7
  code-coverage:
    name: Cobertura de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov \
            gcovr

      - name: Configurar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'c8696863d371ab7f46e213d8f5ca923c4ff5e63c'

      - name: Configurar CMake con cobertura
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -G Ninja

      - name: Compilar con cobertura
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests para cobertura
        run: |
          cd build
          ctest --output-on-failure

      - name: Generar reporte de cobertura
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' --output-file coverage_filtered.info
          lcov --list coverage_filtered.info

      - name: Generar reporte HTML
        run: |
          cd build
          genhtml coverage_filtered.info --output-directory coverage_html

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Mostrar resumen de cobertura
        run: |
          cd build
          lcov --summary coverage_filtered.info

  static-analysis:
    name: Análisis Estático
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            clang-tools \
            build-essential \
            cmake \
            ninja-build

      - name: Configurar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'c8696863d371ab7f46e213d8f5ca923c4ff5e63c'

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Ejecutar clang-tidy
        run: |
          echo "Ejecutando análisis estático con clang-tidy"
          find core src -name '*.cpp' -not -path '*/vcpkg_installed/*' | \
            xargs clang-tidy -p build --config-file=.clang-tidy 2>&1 | \
            tee clang-tidy-report.txt || true

      - name: Verificar advertencias críticas
        run: |
          if grep -i "error:" clang-tidy-report.txt; then
            echo "Se encontraron errores críticos en el análisis estático"
            exit 1
          fi
          echo "Análisis estático completado sin errores críticos"

      - name: Subir reporte de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: clang-tidy-report.txt
          retention-days: 30
