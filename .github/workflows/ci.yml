name: MoLab CI Pipeline

on:
  push:
    branches: [main, develop, feature/*]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build C++ Core & Plugins
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: x64-osx

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-tk \
            pkg-config

      - name: Instalar dependencias de sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Configurar vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -G Ninja

      - name: Compilar proyecto
        run: cmake --build build --config Release --parallel

      - name: Verificar binarios generados
        run: |
          echo " Verificando binarios generados..."
          ls -lh build/bin/
          ls -lh build/lib/
          file build/bin/simulator

      - name: Validar sintaxis de scripts Python
        run: |
          echo "Validando scripts Python"
          python3 -m py_compile tools/*.py || true

      - name: Subir artefactos de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-build-${{ matrix.os }}
          path: |
            build/bin/
            build/lib/
          retention-days: 7
  code-quality:
    name: Validación de Calidad
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar formato de archivos
        run: |
          echo "Verificando formato de archivos"
          # Verificar que no haya archivos con espacios en blanco al final
          ! git grep -I -n '[[:space:]]$' -- '*.cpp' '*.h' '*.hpp' || (
            echo " Se encontraron espacios en blanco al final de líneas"
            exit 1
          )

      - name: Validar archivos JSON
        run: |
          echo "Validando archivos JSON"
          find data -name '*.json' -type f -exec sh -c '
            echo "Validando: {}" && \
            python3 -m json.tool {} > /dev/null
          ' \;

      - name: Validar esquemas FlatBuffers
        run: |
          echo "Verificando esquemas FlatBuffers"
          if [ -d "src/schemas" ]; then
            find src/schemas -name '*.fbs' -type f
          fi

  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov

      - name: Configurar vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install

      - name: Configurar CMake con tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -G Ninja

      - name: Compilar proyecto y tests
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests unitarios
        run: |
          cd build
          ctest --output-on-failure --verbose
      
      - name: Validar tasa de éxito de tests
        run: |
          cd build
          # Ejecutar ctest y capturar resultados
          ctest --output-on-failure > test_results.txt 2>&1 || true
          # Extraer estadísticas de tests
          if grep -q "tests passed" test_results.txt; then
            PASSED=$(grep -oP '\d+(?= tests passed)' test_results.txt || echo "0")
            FAILED=$(grep -oP '\d+(?= tests failed)' test_results.txt || echo "0")
            TOTAL=$((PASSED + FAILED))
            if [ "$TOTAL" -gt 0 ]; then
              SUCCESS_RATE=$(awk "BEGIN {printf \"%.2f\", ($PASSED/$TOTAL)*100}")
              echo "Tests pasados: $PASSED/$TOTAL ($SUCCESS_RATE%)"
              if (( $(echo "$SUCCESS_RATE < 95" | bc -l) )); then
                echo "ERROR: Tasa de éxito de tests menor al 95% requerido"
                exit 1
              fi
              echo "Tasa de éxito de tests: $SUCCESS_RATE% (>= 95%)"
            fi
          fi

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7
  code-coverage:
    name: Cobertura de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov \
            gcovr

      - name: Configurar vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install

      - name: Configurar CMake con cobertura
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -G Ninja

      - name: Compilar con cobertura
        run: cmake --build build --config Debug --parallel

      - name: Ejecutar tests para cobertura
        run: |
          cd build
          ctest --output-on-failure

      - name: Generar reporte de cobertura
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,inconsistent
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' --output-file coverage_filtered.info --ignore-errors unused
          lcov --list coverage_filtered.info
      
      - name: Validar cobertura mínima
        run: |
          cd build
          # Extraer porcentaje de cobertura de líneas
          COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep -oP '\\d+\\.\\d+(?=% of)' | head -1)
          if [[ -z "$COVERAGE" ]]; then
            echo "ERROR: No se pudo determinar la cobertura de código."
            exit 1
          fi
          echo "Cobertura de código: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "WARNING: Cobertura de código menor al 60% recomendado (actual: $COVERAGE%)"
            echo "Se recomienda agregar más tests para mejorar la cobertura"
          else
            echo "Cobertura de código aceptable: $COVERAGE% (>= 60%)"
          fi

      - name: Generar reporte HTML
        run: |
          cd build
          genhtml coverage_filtered.info --output-directory coverage_html

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Mostrar resumen de cobertura
        run: |
          cd build
          lcov --summary coverage_filtered.info

  static-analysis:
    name: Análisis Estático
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            clang-tools \
            build-essential \
            cmake \
            ninja-build

      - name: Configurar vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install

      - name: Configurar CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Generar archivos FlatBuffers
        run: |
          echo "Generando archivos necesarios (FlatBuffers, etc.)"
          cmake --build build --target generate_flatbuffers || cmake --build build -j2

      - name: Ejecutar clang-tidy
        run: |
          echo "Ejecutando análisis estático con clang-tidy"
          find core src -name '*.cpp' -not -path '*/vcpkg_installed/*' | \
            xargs clang-tidy -p build --config-file=.clang-tidy 2>&1 | \
            tee clang-tidy-report.txt || true
      
      - name: Contar advertencias de clang-tidy
        run: |
          WARNING_COUNT=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: warning:" clang-tidy-report.txt || echo "0")
          ERROR_COUNT=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: error:" clang-tidy-report.txt || echo "0")
          echo "Advertencias encontradas: $WARNING_COUNT"
          echo "Errores encontrados: $ERROR_COUNT"
          if [ "$WARNING_COUNT" -gt 50 ]; then
            echo "WARNING: Demasiadas advertencias de clang-tidy ($WARNING_COUNT > 50)"
            echo "Se recomienda corregir las advertencias para mejorar la calidad del código"
          fi
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "ERROR: Se encontraron $ERROR_COUNT errores de clang-tidy"
          else
            echo "Sin errores de clang-tidy"
          fi

      - name: Verificar advertencias críticas
        run: |
          if grep -E "^[^:]+:[0-9]+:[0-9]+: error:" clang-tidy-report.txt; then
            echo "Se encontraron errores críticos en el análisis estático"
            echo "Por favor revisa el reporte de clang-tidy para más detalles"
            exit 1
          fi
          echo "Análisis estático completado sin errores críticos"

      - name: Subir reporte de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: clang-tidy-report.txt
          retention-days: 30

  quality-summary:
    name: Resumen de Calidad
    runs-on: ubuntu-latest
    needs: [build-and-test, unit-tests, code-coverage, static-analysis]
    if: always()
    
    steps:
      - name: Generar resumen de calidad
        run: |
          echo "# Resumen de Calidad del Pipeline CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Estado de Jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Unitarios | ${{ needs.unit-tests.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cobertura de Código | ${{ needs.code-coverage.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Análisis Estático | ${{ needs.static-analysis.result == 'success' && '✅ Exitoso' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Métricas de Calidad" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Unitarios**: Tasa de éxito >= 95% requerida" >> $GITHUB_STEP_SUMMARY
          echo "- **Cobertura de Código**: >= 60% recomendada" >> $GITHUB_STEP_SUMMARY
          echo "- **Análisis Estático**: 0 errores críticos requeridos" >> $GITHUB_STEP_SUMMARY
          echo "- **Advertencias**: <= 50 advertencias recomendadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build-and-test.result }}" == "success" && "${{ needs.unit-tests.result }}" == "success" && "${{ needs.code-coverage.result }}" == "success" && "${{ needs.static-analysis.result }}" == "success" ]]; then
            echo "## Pipeline CI Completado Exitosamente" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Todos los checks de calidad han pasado. El código está listo para merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Pipeline CI con Fallos" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Algunos checks de calidad han fallado. Por favor revisa los logs para más detalles." >> $GITHUB_STEP_SUMMARY
          fi
