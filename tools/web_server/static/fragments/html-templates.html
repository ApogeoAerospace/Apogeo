<!-- HTML Templates -->
<template id="result-item-template">
    <div class="result-item">
        <h4 class="result-filename"> Filename</h4>
        <p class="result-info"> Modified: <span class="result-date"></span> | Size: <span class="result-size"></span> KB</p>
        <button class="btn btn-primary result-visualize-btn"> Visualize</button>
    </div>
</template>

<template id="performance-alert-template">
    <div class="performance-alert">
        <h4 class="alert-title"></h4>
        <p class="alert-message"></p>
    </div>
</template>
