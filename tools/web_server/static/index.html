<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Apogeo - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>
    <video
        id="bg-video"
        src="assets/videos/logovideo.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
    ></video>

    <div class="vignette"></div>

    <div class="ui">
        <button class="btn-start" id="btn" type="button">
            Inicio
        </button>
    </div>

    <div class="transition-overlay" id="overlay"></div>

    <script>
        const btn = document.getElementById('btn');
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('bg-video');
        const DESTINO = './app.html';

        function showStartButton() {
            btn.classList.add('show');
        }

        // Button effect after 5 deg (temporal).
        setTimeout(showStartButton, 5000);

        // If video falls, the idea is that it puts a black wallpaper and we can start normally
        
        video.addEventListener('error', () => {
            setTimeout(showStartButton, 5000);
        }, { once: true });

        btn.addEventListener('click', () => {
            overlay.classList.add('active');
            setTimeout(() => {
                window.location.href = DESTINO;
            }, 580);
        });
    </script>
</body>
</html>
